[project]
name = "quant-blm"
version = "0.1.0"
description = "Quantum Brain project for mapping codebase semantics using codebase-memory-mcp"
authors = [{name = "Maheshwar Anup"}]
dependencies = [
    "codebase-memory-mcp>=0.8.1",
    "typer>=0.12",
    "apscheduler>=3.10",
    "gitpython>=3.1",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "rich>=13.7",
    "schedule>=1.2",
    "lru-dict>=1.3",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "pytest-mock>=3.15.1",
]
requires-python = ">=3.11"

[project.scripts]
qbrain = "brain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
    "ignore::DeprecationWarning:.*SwigPy.*",
]
