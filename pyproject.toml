[tool.poetry]
name = "quant-blm"
version = "0.1.0"
description = "Quantum Brain project for mapping codebase semantics using codebase-memory-mcp"
authors = ["Antigravity"]
readme = "README.md"
packages = [{include = "brain"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = "^0.12"}
apscheduler = "^3.10"
gitpython = "^3.1"
sentence-transformers = "^3.0"
numpy = "^1.26"
rich = "^13.7"
schedule = "^1.2"
lru-dict = "^1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
